
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android source
      run: unzip -q AndroidVideoSaver-project-v6.zip -d android-source
      - name: Compile Android APK
        working-directory: android-source
        run: gradle --no-daemon assembleDebug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidVideoSaver-debug-apk
          path: android-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
